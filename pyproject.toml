[project]
name = "tobi-framework"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alay-maker", email = "amugica23@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "instructor>=1.17.0",
    "ollama>=0.6.3",
    "polars>=2.1.0",
    "pydantic-ai>=2.38.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
]

[project.scripts]
tobi-framework = "tobi_framework:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tobi"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]


